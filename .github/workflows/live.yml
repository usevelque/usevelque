name: live

# Keeps the profile README alive. GitHub delays and drops `schedule` on quiet
# repositories, so the job does not rely on it: one run works a whole shift,
# redrawing the market board from Solana every half hour for three hours, then
# starts the next run of itself. The cron below is only a safety net: if a chain
# ever dies, the next tick starts a new one.
#
# The concurrency group keeps two chains from overlapping: a second run waits
# for the first instead of doubling up. Everything goes to the `output` branch,
# so `main` only changes when someone edits the profile.

on:
  schedule:
    - cron: '11 */3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write            # needed to hand over to the next run

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: snake
        uses: Platane/snk@v3
        with:
          github_user_name: usevelque
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#2a1228&color_dots=#f4eef1,#fbd0dd,#f8aec6,#f58aae,#d6577f
            dist/snake-dark.svg?palette=github-dark&color_snake=#7fd9c4&color_dots=#1b1420,#5a2a45,#9c4a6f,#d86c95,#f58aae

      - name: own the output folder
        # the snake generator runs in a container as root, so the runner cannot write inside dist
        run: |
          mkdir -p dist
          sudo chown -R "$(id -u):$(id -g)" dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: dependencies
        run: npm install --no-save --no-audit --no-fund @solana/web3.js github:usevelque/velque-sdk

      - name: board every half hour for one shift
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 6); do
            echo "::group::board $i of 6"
            # if the chain cannot be read this time, keep the previous board
            node .github/scripts/board.mjs || for f in board-light.svg board-dark.svg; do
              curl -fsS -o "dist/$f" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/output/$f" || true
            done
            (
              cd dist
              rm -rf .git
              git init -q -b output
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -q -m "Live board and snake, $(date -u +'%Y-%m-%d %H:%M') UTC"
              git push -q --force "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" output
            ) || echo "publish failed this time, carrying on"
            echo "::endgroup::"
            if [ "$i" -lt 6 ]; then sleep 1740; fi
          done

      - name: hand over to the next shift
        if: always()
        run: |
          # a run that broke early must not restart itself in a tight loop
          [ "${{ job.status }}" = "success" ] || sleep 600
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/live.yml/dispatches" \
            -d '{"ref":"main"}'
