name: live

# Keeps the profile README alive: the market board is read from Solana every
# half hour, the contribution snake is redrawn with it. Both go to the `output`
# branch, so `main` only changes when someone edits the profile.

on:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: snake
        uses: Platane/snk@v3
        with:
          github_user_name: usevelque
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#2a1228&color_dots=#f4eef1,#fbd0dd,#f8aec6,#f58aae,#d6577f
            dist/snake-dark.svg?palette=github-dark&color_snake=#7fd9c4&color_dots=#1b1420,#5a2a45,#9c4a6f,#d86c95,#f58aae

      - name: own the output folder
        # the snake generator runs in a container as root, so the runner cannot write inside dist
        run: |
          mkdir -p dist
          sudo chown -R "$(id -u):$(id -g)" dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: board
        run: |
          npm install --no-save --no-audit --no-fund @solana/web3.js github:usevelque/velque-sdk
          # if the chain cannot be read this time, keep the previous board
          node .github/scripts/board.mjs || for f in board-light.svg board-dark.svg; do
            curl -fsS -o "dist/$f" "https://raw.githubusercontent.com/${{ github.repository }}/output/$f" || true
          done

      - name: publish
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live board and snake, $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
